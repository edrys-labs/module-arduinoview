<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Arduino-View</title>

    <meta name="description" content="Host websites on an Arduino and use them from every browser in the room. The station connects the Arduino via Web Serial (Chrome, Edge or Firefox 151+). For more information and configuration, see:<br /><a href='https://github.com/edrys-labs/module-arduinoview' target='_blank'>https://github.com/edrys-labs/module-arduinoview</a>">

    <meta name="show-in" content="station">

    <meta name="module-config" content="{
        'stationConfig': {
          'baudrate': {
            'type': 'select',
            'options': ['110', '300', '1200', '2400', '4800', '9600', '19200', '38400', '57600', '115200'],
            'hint': 'Baud rate of the Arduino sketch. Leave empty to let the station choose (default: 9600)'
          },
          'autoconnect': {
            'type': 'boolean',
            'hint': 'Connect to the Arduino when the station opens and when it is plugged in again (the station must have chosen the port once)'
          }
        }
      }">

    <script src="https://edrys-labs.github.io/module/edrys.js"></script>

    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/water.min.css">
    <link rel="stylesheet" href="https://edrys-labs.github.io/module/vendor/open-iconic/css/open-iconic.min.css">

    <style>html > body {
  box-sizing: border-box;
  flex-direction: column;
  max-width: 100%;
  height: 100vh;
  margin: 0;
  padding: .5rem;
  display: flex;
}

#app {
  flex-wrap: wrap;
  align-items: center;
  gap: .5rem 1rem;
  margin-bottom: .5rem;
  display: flex;
}

.title {
  font-size: 1.4em;
  line-height: 1;
}

.status, .message {
  font-size: small;
}

.status > .label {
  opacity: .7;
}

.message:empty {
  display: none;
}

.badge {
  color: #fff;
  border-radius: 999px;
  padding: .1rem .5rem;
  font-weight: bold;
  display: inline-block;
}

.badge.on {
  background-color: #1f7a45;
}

.badge.off {
  background-color: #b8384a;
}

.badge.wait {
  background-color: #6b6b6b;
}

.controls {
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem;
  margin-left: auto;
  font-size: small;
  display: flex;
}

.controls label {
  white-space: nowrap;
  align-items: center;
  gap: .25rem;
  margin: 0;
  display: inline-flex;
}

.controls input, .controls select, .controls button {
  margin: 0;
}

.controls button {
  white-space: nowrap;
}

#stage {
  flex: 1;
  min-height: 0;
  position: relative;
}

#sandbox {
  box-sizing: border-box;
  background-color: #fff;
  border: 1px solid #80808080;
  border-radius: 6px;
  width: 100%;
  height: 100%;
  margin: 0;
  display: block;
}

#placeholder {
  text-align: center;
  color: #6b6b6b;
  pointer-events: none;
  justify-content: center;
  align-items: center;
  margin: 0;
  padding: 1rem;
  display: flex;
  position: absolute;
  inset: 0;
}

#placeholder[hidden] {
  display: none;
}
</style>
  </head>
  <body>
    <header id="app">
      <span class="title">Arduino-View</span>
      <span class="status">
        <span class="label">device:</span>
        <span id="badge" class="badge wait">loading…</span>
      </span>
      <span id="message" class="message" role="status"></span>

      <span class="controls">
        <label>
          auto-connect: <input type="checkbox" id="autoconnect">
        </label>
        <label>
          baud:
          <select id="baudrate">
            <option value="110">110</option>
            <option value="300">300</option>
            <option value="1200">1200</option>
            <option value="2400">2400</option>
            <option value="4800">4800</option>
            <option value="9600" selected="">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
          </select>
        </label>
        <button id="connect">
          <span class="oi" data-glyph="link-intact" aria-hidden="true"></span>
          <span id="connect-label">Connect</span>
        </button>
        <button id="reload" title="Ask the Arduino for its GUI again">
          <span class="oi" data-glyph="reload" aria-hidden="true"></span>
          Reload
        </button>
      </span>
    </header>

    <div id="stage">
      <!-- sandboxed: the Arduino's HTML/JS gets an opaque origin and cannot reach
           this frame or Edrys; allow-downloads for the charts' "save as image",
           allow-modals for sketches that call alert() (see the examples) -->
      <iframe id="sandbox" title="GUI of the Arduino" src="https://edrys-labs.github.io/module-arduinoview/sandbox.html" sandbox="allow-scripts allow-downloads allow-modals"></iframe>
      <p id="placeholder"></p>
    </div>

    <script src="https://edrys-labs.github.io/module-arduinoview/index.fd071c14.js"></script>
  </body>
</html>
